name: poc-mcp-fragment-settlement
on:
  push:
    branches: ["poc/mcp-fragment-settlement-20260927"]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: forge build
      - name: Start local chain
        run: |
          anvil --chain-id 4663 --host 127.0.0.1 --port 8545 > /tmp/anvil.log 2>&1 &
          for i in $(seq 1 30); do
            cast chain-id --rpc-url http://127.0.0.1:8545 && break
            sleep 1
          done
      - run: node scripts/poc-mcp-fragment-settlement.mjs
